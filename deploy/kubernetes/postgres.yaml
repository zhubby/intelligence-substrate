apiVersion: v1
kind: Service
metadata:
  name: substrate-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: substrate-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: substrate-postgres
spec:
  serviceName: substrate-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: substrate-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: substrate-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_USER
              value: substrate
            - name: POSTGRES_DB
              value: substrate
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, substrate, -d, substrate]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, substrate, -d, substrate]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: database
              mountPath: /var/lib/postgresql/data
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: secrets
          secret:
            secretName: substrate-secrets
            defaultMode: 0440
            items:
              - key: postgres-password
                path: postgres-password
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: database
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
