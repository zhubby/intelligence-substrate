apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: substrate-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: substrate
spec:
  selector:
    app.kubernetes.io/name: intelligence-substrate
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substrate
spec:
  replicas: 1
  # Git, CAS and the database form a single-writer control plane.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: intelligence-substrate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intelligence-substrate
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: data-permissions
          image: ghcr.io/zhubby/intelligence-substrate:latest
          command: [sh, -c, "chown 10001:10001 /data && chmod 0700 /data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: platform
          image: ghcr.io/zhubby/intelligence-substrate:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: substrate-config
          env:
            - name: IS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: substrate-secrets
                  key: database-url
            - name: IS_BOOTSTRAP_PASSWORD_FILE
              value: /run/secrets/bootstrap-password
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          # Database outages should remove readiness, not restart the writer.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: substrate-data
        - name: secrets
          secret:
            secretName: substrate-secrets
            defaultMode: 0440
            items:
              - key: bootstrap-password
                path: bootstrap-password
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
