name: delivery_app
description: A multi-platform delivery reference application.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: 1.5.0
  cupertino_icons: 1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansSC-LICENSE.txt
    - assets/fonts/Roboto-LICENSE.txt
    - assets/fonts/provenance.json
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
