name: Quality and images

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: substrate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: substrate
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U substrate" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go checks with PostgreSQL
        run: |
          go vet ./...
          go test -race -timeout=20m ./...
        env:
          IS_TEST_POSTGRES_URL: postgres://substrate:ci-only-password@localhost:5432/substrate?sslmode=disable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Release browser dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Trusted release binaries and local TLS delivery
        run: |
          mkdir -p bin
          for command in cmd/*; do
            go build -trimpath -o "bin/is-$(basename "$command")" "./$command"
          done
          node scripts/verify-release.mjs
          node scripts/verify-runtime.mjs
          GOOS=windows GOARCH=amd64 go build ./cmd/...

  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Workbench dependencies and build
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
          npx playwright install --with-deps chromium
      - name: Browser regression
        run: python3 scripts/verify-workbench.py --projects "${{ matrix.project }}" --work-dir "work/ci-workbench-${{ matrix.project }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.project }}
          path: work/ci-workbench-${{ matrix.project }}/result.json
          if-no-files-found: ignore

  blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Reference blueprint and delivery tools
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          go -C blueprints/flutter-go/backend test -race ./...

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: intelligence-substrate:ci
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
      - name: Production container and recovery drill
        run: |
          docker pull postgres:17-alpine
          mkdir -p work
          python3 scripts/verify-deployment.py --work-dir work/ci-container-drill --platform-image intelligence-substrate:ci --postgres-image postgres:17-alpine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-results
          path: |
            work/ci-container-drill/result.json
            work/ci-container-drill/commands.json
          if-no-files-found: ignore

  images:
    needs: [go, workbench, blueprint, container]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names and revision metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Publish AMD64 and ARM64 images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
      - name: Record immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Published image: %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
